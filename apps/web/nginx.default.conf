server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Never serve sourcemaps (belt-and-suspenders: vite stops emitting them,
    # but deny here too in case a future build turns them back on).
    location ~ \.map$ {
        deny all;
    }

    # SPA fallback for every client-side route: /app/*, /admin/*, /enterprise/*,
    # /docs/*, /request-access, /settings — a single catch-all so deep links and
    # refreshes on any route resolve to index.html instead of 404.
    location / {
        try_files $uri /index.html;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy (if running behind same nginx)
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://api:8000;
    }

    location = /index.html {
        expires -1;
    }
}
