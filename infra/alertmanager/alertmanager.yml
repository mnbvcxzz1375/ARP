global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    # No notification endpoint configured by default.
    # To enable notifications, configure one of:
    #   - email_configs: SMTP relay
    #   - webhook_configs: HTTP webhook (set WEBHOOK_URL env)
    #   - slack_configs: Slack incoming webhook
    #
    # Until a receiver is configured, alerts fire but are NOT delivered.
    # Alertmanager UI at http://localhost:9093 shows active alerts.

  - name: "critical"
    # Same as default — no endpoint configured.
    # Production: wire this to PagerDuty, Opsgenie, or on-call Slack channel.

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]