services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      AGENTNET_ENV: ${AGENTNET_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES}
      WS_HEARTBEAT_INTERVAL_S: ${WS_HEARTBEAT_INTERVAL_S}
      WS_HEARTBEAT_TIMEOUT_S: ${WS_HEARTBEAT_TIMEOUT_S}
      WS_MAX_CONNECTIONS_PER_AGENT: ${WS_MAX_CONNECTIONS_PER_AGENT}
      RATE_LIMIT_WINDOW_S: ${RATE_LIMIT_WINDOW_S}
      RATE_LIMIT_GLOBAL_MAX: ${RATE_LIMIT_GLOBAL_MAX}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX}
      RATE_LIMIT_AGENT_MAX: ${RATE_LIMIT_AGENT_MAX}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX}
      TASK_MAX_RUNTIME_S: ${TASK_MAX_RUNTIME_S}
      TASK_LEASE_DURATION_S: ${TASK_LEASE_DURATION_S}
      TIMEOUT_WORKER_INTERVAL_S: ${TIMEOUT_WORKER_INTERVAL_S}

      # Dashboard session
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      SESSION_USER_LIFETIME_DAYS: ${SESSION_USER_LIFETIME_DAYS}
      SESSION_ADMIN_LIFETIME_DAYS: ${SESSION_ADMIN_LIFETIME_DAYS}
      SESSION_USER_IDLE_HOURS: ${SESSION_USER_IDLE_HOURS}
      SESSION_ADMIN_IDLE_HOURS: ${SESSION_ADMIN_IDLE_HOURS}
      SESSION_STEP_UP_DURATION_MINUTES: ${SESSION_STEP_UP_DURATION_MINUTES}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentnet_internal

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - agentnet_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/agentnet.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates — mount host directory read-only.
      # Linux (letsencrypt): leave SSL_CERT_DIR unset (defaults to /etc/letsencrypt)
      # Windows Docker Desktop: set SSL_CERT_DIR=E:\SSL in .env.production
      # Certs must exist at: $SSL_CERT_DIR/live/andrewhyc.top/fullchain.pem
      #                    : $SSL_CERT_DIR/live/andrewhyc.top/privkey.pem
      - ${SSL_CERT_DIR:-/etc/letsencrypt}:/etc/ssl/agentnet:ro
      # Only needed for certbot ACME HTTP-01 challenges (can be an empty dir)
      - ./certbot/www:/var/www/certbot:rw
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - agentnet_internal
      - agentnet_edge

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - agentnet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agentnet_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - agentnet_redis_data:/data
    networks:
      - agentnet_internal

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles:
      - observability
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - agentnet_prometheus_data:/prometheus
    networks:
      - agentnet_internal

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    profiles:
      - observability
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentnet_internal

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    profiles:
      - observability
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agentnet_internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    profiles:
      - observability
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - agentnet_alertmanager_data:/alertmanager
    networks:
      - agentnet_internal

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - agentnet_grafana_data:/var/lib/grafana
    networks:
      - agentnet_internal

networks:
  agentnet_internal:
    internal: true
  agentnet_edge:

volumes:
  agentnet_postgres_data:
  agentnet_redis_data:
  agentnet_prometheus_data:
  agentnet_alertmanager_data:
  agentnet_grafana_data:
