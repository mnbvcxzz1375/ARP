services:
  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://agentnet:agentnet@postgres:5432/agentnet
      REDIS_URL: redis://redis:6379/0
      AGENTNET_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_AGENTNET_API_BASE: http://localhost:8000
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentnet
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet
    ports:
      - "5432:5432"
    volumes:
      - agentnet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentnet -d agentnet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentnet_postgres_data: