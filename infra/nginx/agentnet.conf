# AgentNet production nginx config with TLS 1.3 + WebSocket upgrade.
# Drop this into /etc/nginx/sites-enabled/ and symlink SSL certs.
# Run: certbot --nginx -d agentnet.your-domain.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agentnet_api {
    server api:8000;
}

# ------------------------------------------------------------------
# HTTP → HTTPS redirect
# ------------------------------------------------------------------
server {
    listen 80;
    server_name agentnet.your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# HTTPS with TLS 1.3
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name agentnet.your-domain.com;

    # TLS — replace with your cert paths after certbot
    ssl_certificate     /etc/letsencrypt/live/agentnet.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentnet.your-domain.com/privkey.pem;

    # Modern TLS config (Mozilla Intermediate, 2024)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (uncomment in production)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthz — no auth
    location = /healthz {
        proxy_pass http://agentnet_api;
    }

    # Metrics — internal only (prometheus scraping)
    location = /metrics {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://agentnet_api;
    }

    # WebSocket — critical: always HTTP/1.1 with Upgrade header
    location /v1/ws {
        proxy_pass http://agentnet_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API
    location / {
        proxy_pass http://agentnet_api;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
