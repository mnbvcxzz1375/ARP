# AgentNet production nginx config — TLS 1.3, WebSocket, SPA + API proxy.
# Certificates are mounted from the host into /etc/ssl/agentnet/.
# See infra/.env.production.example -> SSL_CERT_DIR.
#
# Windows Docker Desktop:  set SSL_CERT_DIR=E:\SSL in .env.production
# Linux VPS (letsencrypt): leave SSL_CERT_DIR unset (defaults to /etc/letsencrypt)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agentnet_api {
    server api:8000;
}

upstream agentnet_web {
    server web:80;
}

# ------------------------------------------------------------------
# HTTP -> HTTPS redirect (with ACME challenge support)
# ------------------------------------------------------------------
server {
    listen 80;
    server_name andrewhyc.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# HTTPS
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name andrewhyc.top;

    # TLS — certs mounted from host. Expected layout (letsencrypt-style):
    #   /etc/ssl/agentnet/live/andrewhyc.top/fullchain.pem
    #   /etc/ssl/agentnet/live/andrewhyc.top/privkey.pem
    # Adjust the mount source in docker-compose.prod.yml or .env.production
    # if your certs live at a different path.
    ssl_certificate     /etc/ssl/agentnet/live/andrewhyc.top/fullchain.pem;
    ssl_certificate_key /etc/ssl/agentnet/live/andrewhyc.top/privkey.pem;

    # Modern TLS (Mozilla Intermediate, 2024)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (uncomment after confirming TLS works)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 1m;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security headers for all proxied responses
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API routes ──────────────────────────────────────────────

    # Healthz — no auth
    location = /healthz {
        proxy_pass http://agentnet_api;
    }

    # Metrics — private network only (Prometheus scraping)
    location = /metrics {
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://agentnet_api;
    }

    # WebSocket — must use HTTP/1.1 with Upgrade header
    location /v1/ws {
        proxy_pass http://agentnet_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API
    location /v1/ {
        proxy_pass http://agentnet_api;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── OpenAPI docs (FastAPI-served) ──────────────────────────
    location = /openapi.json {
        proxy_pass http://agentnet_api;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Public docs site lives in the SPA at /docs and /docs/* (App.tsx).
    # The FastAPI swagger/redoc stay reachable on the API port directly
    # (api:8000/docs); the explorer is not published on the public host.
    location /docs {
        proxy_pass http://agentnet_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Never serve sourcemaps from the web container (vite stops emitting
    # them; this deny is a second layer for future builds).
    location ~ \.map$ {
        deny all;
    }

    location = /redoc {
        proxy_pass http://agentnet_api;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── SPA routes ──────────────────────────────────────────────

    # SPA fallback — login page
    location /login {
        proxy_pass http://agentnet_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — app routes
    location /app/ {
        proxy_pass http://agentnet_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — admin routes
    location /admin/ {
        proxy_pass http://agentnet_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Catch-all — everything else goes to the SPA
    location / {
        proxy_pass http://agentnet_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
