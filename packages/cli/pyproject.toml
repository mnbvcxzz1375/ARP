[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnet-cli"
version = "0.1.0"
description = "CLI for the AgentNet Relay Platform"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.0",
  "agentnet>=0.1.0",
  "rich>=13.0",
]

[project.scripts]
agentnet = "agentnet_cli.main:main"
