tags:
- name: health
  description: Liveness checks used by operators and load balancers.
- name: auth
  description: User registration and API key bootstrap.
- name: agents
  description: Agent registry, Agent Number metadata, and token rotation.
- name: tasks
  description: Asynchronous task creation, lookup, messages, and progress history.
- name: connections
  description: Cross-agent connection requests and approvals.
- name: approvals
  description: Human-in-the-loop high-risk task approvals.
- name: routing
  description: 'Routing runtime: route decisions, relay nodes, delivery events, and
    policies.'
- name: personal
  description: 'Personal mode: simplified local-first routing for individual users.'
- name: sla
  description: 'SLA monitoring: targets, violations, metrics, and compliance reports.'
- name: continuity
  description: 'Business continuity: failover configs, circuit breakers, and relay
    health.'
- name: dashboard
  description: 'Dashboard APIs: network overview, egress logs, and statistics.'
- name: organizations
  description: 'Organization management: membership, roles, and member administration.'
servers:
- url: http://localhost:8000
  description: Local development
